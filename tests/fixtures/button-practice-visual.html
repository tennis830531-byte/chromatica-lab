<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>按鍵練習室窄螢幕驗證</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>body{padding:12px}.visual-fixture{width:auto;max-width:680px;margin:auto}</style>
  </head>
  <body>
    <main class="visual-fixture button-practice-view">
      <section class="interval-player" aria-label="按鍵練習測試畫面">
        <div class="interval-player-top paper-card">
          <div><p class="eyebrow">目前練習</p><h3>半音階穿梭｜普通</h3></div>
          <div class="interval-progress-pills"><span>循環 <b>1 / 4</b></span><span><b>60</b> BPM</span></div>
        </div>
        <div class="interval-score-card paper-card button-practice-score-card">
          <div class="interval-score-heading"><div><span>完整練習樂句</span><small>第 2 / 8 小節</small></div></div>
          <div class="interval-score-line">
            <div class="interval-staff"><svg viewBox="0 0 640 140"><g stroke="#6f4b32"><path d="M18 70H622M18 82H622M18 94H622M18 106H622M18 118H622"/><path d="M253 70V118M376 70V118M499 70V118M622 70V118"/></g><text x="18" y="119" font-size="62">𝄞</text><text x="152" y="100" font-size="26">● ● ● ●</text><text x="275" y="94" font-size="26" fill="#d34f45">●</text><text x="305" y="89" font-size="26">♯● ● ●</text></svg></div>
            <div class="interval-note-help button-practice-number-help">
              <span class="completed"><small>第 1 小節</small><em><i class="button-score-note completed"><b class="jianpu-note">1</b><strong class="button-note-action">放</strong><small>1孔 · 吹</small></i><i class="button-score-note completed"><b class="jianpu-note"><i class="jianpu-accidental">♯</i>1</b><strong class="button-note-action">按</strong><small>1孔 · 吹</small></i><i class="button-score-note completed"><b class="jianpu-note">2</b><strong class="button-note-action">放</strong><small>1孔 · 吸</small></i><i class="button-score-note completed"><b class="jianpu-note"><i class="jianpu-accidental">♯</i>2</b><strong class="button-note-action">按</strong><small>1孔 · 吸</small></i></em></span>
              <span class="active"><small>第 2 小節</small><em><i class="button-score-note active"><b class="jianpu-note active">3</b><strong class="button-note-action">放</strong><small>2孔 · 吹</small></i><i class="button-score-note"><b class="jianpu-note">4</b><strong class="button-note-action">按</strong><small>2孔 · 吹</small></i><i class="button-score-note"><b class="jianpu-note"><i class="jianpu-accidental">♯</i>4</b><strong class="button-note-action">按</strong><small>2孔 · 吸</small></i><i class="button-score-note"><b class="jianpu-note">5</b><strong class="button-note-action">放</strong><small>3孔 · 吹</small></i></em></span>
              <span><small>第 3 小節</small><em><i class="button-score-note"><b class="jianpu-note">6</b><strong class="button-note-action">放</strong><small>3孔 · 吸</small></i><i class="button-score-note"><b class="jianpu-note">7</b><strong class="button-note-action">放</strong><small>4孔 · 吸</small></i><i class="button-score-note"><b class="jianpu-note"><i class="jianpu-octave-dot is-high">•</i>1</b><strong class="button-note-action">放</strong><small>4孔 · 吹</small></i><i class="button-score-note"><b class="jianpu-note"><i class="jianpu-octave-dot is-high">•</i><i class="jianpu-accidental">♯</i>1</b><strong class="button-note-action">按</strong><small>4孔 · 吹</small></i></em></span>
              <span><small>第 4 小節</small><em><i class="button-score-note"><b class="jianpu-note">2</b><strong class="button-note-action">放</strong><small>5孔 · 吸</small></i><i class="button-score-note"><b class="jianpu-note">3</b><strong class="button-note-action">放</strong><small>6孔 · 吹</small></i><i class="button-score-note"><b class="jianpu-note">4</b><strong class="button-note-action">按</strong><small>6孔 · 吹</small></i><i class="button-score-note"><b class="jianpu-note">5</b><strong class="button-note-action">放</strong><small>7孔 · 吹</small></i></em></span>
            </div>
          </div>
          <div class="interval-score-line">
            <div class="interval-staff"><svg viewBox="0 0 640 140"><path d="M18 70H622M18 82H622M18 94H622M18 106H622M18 118H622" stroke="#6f4b32"/><text x="18" y="119" font-size="62">𝄞</text><text x="152" y="90" font-size="26">● ● ● ●　● ● ● ●</text></svg></div>
            <div class="interval-note-help button-practice-number-help"><span><small>第 5 小節</small><em><i class="button-score-note"><b class="jianpu-note">1</b><strong class="button-note-action">放</strong><small>8孔 · 吹</small></i></em></span><span><small>第 6 小節</small><em><i class="button-score-note"><b class="jianpu-note">2</b><strong class="button-note-action">按</strong><small>8孔 · 吸</small></i></em></span><span><small>第 7 小節</small><em><i class="button-score-note"><b class="jianpu-note">3</b><strong class="button-note-action">放</strong><small>9孔 · 吹</small></i></em></span><span><small>第 8 小節</small><em><i class="button-score-note"><b class="jianpu-note">4</b><strong class="button-note-action">按</strong><small>10孔 · 吹</small></i></em></span></div>
          </div>
        </div>
        <div class="interval-metronome paper-card"><div><span class="metronome-dot is-playing"></span><strong>節拍引導</strong><small>4 拍預備後開始</small></div><span class="interval-metronome-status is-playing">練習中</span></div>
        <div class="interval-practice-actions"><button id="buttonPracticeStartPause" class="primary-btn">暫停練習</button><button class="ghost-btn">重新開始</button><button class="ghost-btn">重新產生題目</button><button class="ghost-btn">練習設定</button></div>
      </section>
    </main>
  </body>
</html>
